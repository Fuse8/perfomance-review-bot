services:
  postgres:
    image: postgres:16
    ports:
      - '127.0.0.1:5435:5432'
    environment:
      POSTGRES_DB: performance_review_bot
      POSTGRES_USER: performance_review_bot
      POSTGRES_PASSWORD: performance_review_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
